<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>다온펫살롱 미니룸</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><span id="sceneName"></span><span id="online"></span><button id="resetBtn" title="캐릭터 다시 고르기">🐶 변경</button></div>
<canvas id="minimap" class="hidden" width="150" height="112"></canvas>
<div id="banner"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>
<button id="actBtn" class="hidden">말걸기</button>
<div id="chatlog" class="hidden"></div>
<form id="chatbar" class="hidden" autocomplete="off"><input id="chatIn" maxlength="80" placeholder="Enter로 채팅…"><button>전송</button></form>
<div id="start" class="overlay"><div class="card">
  <div class="titlebar"><span>☁ 다온 미니룸</span><span>♡ ♡ ♡</span></div>
  <h1>🐾 다온펫살롱 마을</h1><p class="sub">나만의 미니미 강아지로 놀러 오세요!</p>
  <div class="step">① 견종을 골라요</div><div id="breeds"></div>
  <div class="step">② 미용 스타일을 골라요</div><div id="styles"></div><p id="styleDesc" class="sdesc"></p>
  <canvas id="preview"></canvas>
  <div class="step">③ 이름을 지어요</div><input id="nick" maxlength="10" placeholder="닉네임 (예: 콩이)">
  <button id="startBtn" class="primary">마을로 출발!</button>
  <p class="tiny">개인정보는 저장하지 않아요. 닉네임과 위치만 함께 접속한 사람에게 보여요.</p>
</div></div>
<div id="tools" class="hidden">
  <button id="emoBtn" title="감정 표현 (1~4)">😊<span>감정</span></button>
  <button id="ballBtn" title="공 던지기 (B)">🎾<span>공</span></button>
  <button id="treatBtn" title="간식 먹기 (T)">🦴<span>간식 <b>0</b></span></button>
  <button id="questBtn" title="원장님 심부름 (Q)">🎁<span>심부름</span></button>
  <button id="roomBtn" title="내 미니룸 (R)">🏠<span>미니룸</span></button>
  <button id="gbBtn" title="방명록">📖<span>방명록</span></button>
  <button id="resvBtn" class="resv" title="예약 문의">📅<span>예약 문의</span></button>
</div>
<div id="emoMenu" class="hidden"></div>
<button id="friendBtn" class="hidden">🐶<br>친구</button>
<div id="followChip" class="hidden"><span></span><button>그만</button></div>
<div id="room" class="overlay hidden"><div class="card roomcard">
  <div class="titlebar"><span id="roomTitle">🏠 미니룸</span><span>♡ ♡ ♡</span></div>
  <canvas id="roomCv"></canvas><p id="roomHint" class="tiny"></p>
  <div id="roomTools"><div id="palette"></div><button id="roomDel">🗑 치우기</button><button id="roomReset">↺ 처음 방</button></div>
  <div id="roomVisit"><div class="step">친구 미니룸 놀러가기</div><div id="visitList"></div></div>
  <button id="roomMine">내 방으로</button><button id="roomClose">닫기</button>
</div></div>
<div id="gb" class="overlay hidden"><div class="card gbcard">
  <div class="titlebar"><span>📖 다온펫살롱 방명록</span><span>♡ ♡ ♡</span></div>
  <div class="tabs"><button class="gbtab sel" data-k="gb">방명록</button><button class="gbtab" data-k="ilchon">일촌평</button><button id="gbAdmin" class="hidden" title="관리자">🔑</button></div>
  <form id="gbForm" autocomplete="off"><input id="gbText" maxlength="200"><button class="primary sm">남기기</button></form>
  <p id="gbMsg" class="tiny"></p><div id="gbList"></div>
  <p class="tiny">닉네임과 글만 저장돼요. 욕설은 ♡로 바뀌어요. 서버를 다시 올리면 기록이 지워질 수 있어요.</p>
  <button id="gbClose">닫기</button>
</div></div>
<div id="dialog" class="hidden"><div class="name" id="dlgName"></div><div id="dlgText"></div><div id="dlgChoices"></div></div>
<div id="board" class="overlay hidden"><div class="card board">
  <h2>📌 다온펫살롱 게시판</h2><h3>공지</h3><ul id="notices"></ul>
  <h3>예약 가능 시간</h3><div id="slots"></div>
  <a id="contact" class="primary btn" href="#" target="_blank" rel="noopener">예약 문의하기</a>
  <button id="closeBoard">닫기</button></div></div>
<script src="config.js"></script><script src="dogdata.js"></script><script src="pix.js"></script><script src="art.js"></script><script src="dogs.js"></script><script src="game.js"></script><script src="social.js"></script></body></html>
